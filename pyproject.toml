[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflective-research-agent"
version = "0.1.0"
description = "A CLI agentic-AI tool that gathers research sources, writes a report, reflects on it, and exports clean HTML."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Reflective Research Agent Contributors" }]
keywords = ["ai", "agent", "research", "llm", "deepseek", "arxiv", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.30.0",
    "arxiv>=2.1.0",
    "tavily-python>=0.3.0",
    "ddgs>=9.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
research-agent = "reflective_agent.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/reflective-research-agent"
Repository = "https://github.com/yourusername/reflective-research-agent"
"Bug Tracker" = "https://github.com/yourusername/reflective-research-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/reflective_agent"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
